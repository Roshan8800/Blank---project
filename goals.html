<!DOCTYPE html>
<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-color: #9643ea;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#120B1A]">
<div class="relative flex h-auto min-h-screen w-full flex-col dark justify-between group/design-root" style='font-family: Inter, "Noto Sans", sans-serif;'>
<div class="flex-grow">
<header class="flex items-center justify-between p-4">
<button class="text-white">
<span class="material-symbols-outlined"> arrow_back_ios_new </span>
</button>
<h1 class="text-xl font-bold text-white">Set Goals</h1>
<div class="w-8"></div>
</header>
<main class="px-4 py-6 space-y-8">
<div>
<h2 class="text-white text-lg font-semibold leading-tight tracking-[-0.015em] mb-4">Short-Term Goals</h2>
<div class="bg-[#1C1127] rounded-2xl p-4">
<textarea id="short-term-goal-input" class="form-input w-full resize-none overflow-hidden rounded-xl text-white bg-transparent border-none focus:outline-none focus:ring-0 placeholder:text-[#9378B1] text-base font-normal leading-normal" placeholder="What do you want to achieve in the next week?" rows="4"></textarea>
<button id="short-term-goal-breakdown-button" class="w-full text-left text-sm text-[#9643ea] font-semibold mt-2 flex items-center gap-2">
<span class="material-symbols-outlined text-base"> add_circle </span>
                Break down into smaller tasks
              </button>
</div>
</div>
<div>
<h2 class="text-white text-lg font-semibold leading-tight tracking-[-0.015em] mb-4">Long-Term Goals</h2>
<div class="bg-[#1C1127] rounded-2xl p-4">
<textarea id="long-term-goal-input" class="form-input w-full resize-none overflow-hidden rounded-xl text-white bg-transparent border-none focus:outline-none focus:ring-0 placeholder:text-[#9378B1] text-base font-normal leading-normal" placeholder="What are your goals for the next month or semester?" rows="4"></textarea>
<button id="long-term-goal-breakdown-button" class="w-full text-left text-sm text-[#9643ea] font-semibold mt-2 flex items-center gap-2">
<span class="material-symbols-outlined text-base"> add_circle </span>
                Break down into smaller tasks
              </button>
</div>
</div>
<div class="pt-8">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-4 flex-1 w-full bg-[#9643ea] text-white text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Save Goals</span>
</button>
</div>
</main>
</div>
<footer class="sticky bottom-0">
<div class="flex justify-around border-t border-[#362447] bg-[#1C1127] pt-3 pb-5">
<a class="flex flex-col items-center justify-end gap-1 text-[#9643ea]" href="goals.html">
<span class="material-symbols-outlined"> adjust </span>
<p class="text-xs font-medium">Goals</p>
</a>
<a class="flex flex-col items-center justify-end gap-1 text-[#9378B1]" href="tasks.html">
<span class="material-symbols-outlined"> checklist </span>
<p class="text-xs font-medium">Tasks</p>
</a>
<a class="flex flex-col items-center justify-end gap-1 text-[#9378B1]" href="planner.html">
<span class="material-symbols-outlined"> calendar_today </span>
<p class="text-xs font-medium">Planner</p>
</a>
<a class="flex flex-col items-center justify-end gap-1 text-[#9378B1]" href="progress.html">
<span class="material-symbols-outlined"> leaderboard </span>
<p class="text-xs font-medium">Progress</p>
</a>
<a class="flex flex-col items-center justify-end gap-1 text-[#9378B1]" href="focus.html">
<span class="material-symbols-outlined"> timer </span>
<p class="text-xs font-medium">Focus</p>
</a>
</div>
</footer>
</div>
<div id="toast-container" class="fixed bottom-24 right-4 space-y-2 z-50"></div>
</body></html>
