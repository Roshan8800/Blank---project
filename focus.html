<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studyflow - Focus</title>
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        body { min-height: max(884px, 100dvh); }
        .view { display: none; }
        .view.active { display: block; }
        :root {
            --checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(255,255,255)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');
        }
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
</head>
<body class="bg-gray-950">
    <div class="relative flex h-auto min-h-screen w-full flex-col bg-[#120B1A] dark justify-between group/design-root overflow-x-hidden" style='font-family: Inter, "Noto Sans", sans-serif;'>
        <div class="flex-grow">
            <!-- Focus View -->
            <div id="focus-view" class="view active">
                <header class="flex items-center p-4 justify-between">
                    <button class="text-white">
                        <span class="material-symbols-outlined text-3xl">close</span>
                    </button>
                    <button class="text-white">
                        <span class="material-symbols-outlined text-3xl">settings</span>
                    </button>
                </header>
                <main class="flex flex-col items-center px-4 py-16">
                    <div class="relative w-64 h-64 flex items-center justify-center">
                        <svg class="absolute inset-0" viewBox="0 0 100 100">
                            <circle class="text-[#1E1926]" cx="50" cy="50" fill="transparent" r="45" stroke="currentColor" stroke-width="8"></circle>
                            <circle id="progress-circle" class="text-[#9643ea]" cx="50" cy="50" fill="transparent" r="45" stroke="currentColor" stroke-dasharray="283" stroke-dashoffset="283" stroke-linecap="round" stroke-width="8" style="transform: rotate(-90deg); transform-origin: 50% 50%;"></circle>
                        </svg>
                        <div class="z-10 text-center">
                            <h1 id="timer-display" class="text-white text-5xl font-bold leading-tight">25:00</h1>
                            <p class="text-[#AD93C8] text-lg font-medium">Focus</p>
                        </div>
                    </div>
                    <div class="flex gap-4 mt-16">
                        <button id="pause-button" class="flex w-36 h-12 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-[#1E1926] text-white text-lg font-bold leading-normal tracking-wide">Pause</button>
                        <button id="stop-button" class="flex w-36 h-12 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-[#9643ea] text-white text-lg font-bold leading-normal tracking-wide">Stop</button>
                    </div>
                    <div class="flex items-center gap-4 mt-12 text-white">
                        <button class="text-white"><span class="material-symbols-outlined text-3xl">music_note</span></button>
                        <p class="text-lg">Rain Sounds</p>
                        <button class="text-white"><span class="material-symbols-outlined text-3xl">chevron_right</span></button>
                    </div>
                </main>
            </div>
        </div>

        <nav class="sticky bottom-0 bg-[#1C1326]/80 backdrop-blur-sm">
            <div class="flex justify-around border-t border-[#362447] px-2 py-2">
                <a class="flex flex-1 flex-col items-center justify-end gap-1.5 p-2 text-[#ad93c8]" href="#">
                    <span class="material-symbols-outlined !text-2xl">emoji_events</span>
                    <p class="text-xs font-medium leading-tight">Goals</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1.5 p-2 text-[#ad93c8]" href="tasks.html">
                    <span class="material-symbols-outlined !text-2xl">task_alt</span>
                    <p class="text-xs font-medium leading-tight">Tasks</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1.5 p-2 text-[#ad93c8]" href="#">
                    <span class="material-symbols-outlined !text-2xl">calendar_month</span>
                    <p class="text-xs font-medium leading-tight">Planner</p>
                </a>
<a class="flex flex-1 flex-col items-center justify-end gap-1.5 p-2 text-[#ad93c8]" href="progress.html">
                    <span class="material-symbols-outlined !text-2xl">monitoring</span>
                    <p class="text-xs font-medium leading-tight">Progress</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1.5 rounded-full bg-[#9643ea]/20 p-2 text-white" href="focus.html">
                    <span class="material-symbols-outlined !text-2xl">hourglass_top</span>
                    <p class="text-xs font-bold leading-tight">Focus</p>
                </a>
            </div>
            <div class="h-3 bg-transparent"></div>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
