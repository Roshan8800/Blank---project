<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>
    <meta name="description" content="StudyFlow is a comprehensive study planning and productivity app designed for students, professionals, and lifelong learners.">
    <meta name="author" content="Roshan">

    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #50e3c2;
            --background-color: #f4f7f6;
            --font-color: #333;
            --light-gray: #ecf0f1;
            --dark-gray: #7f8c8d;
            --danger-color: #e74c3c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--background-color);
            color: var(--font-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
        }

        .container {
            padding: 20px;
        }

        /* Auth Container */
        #auth-container h2 {
            text-align: center;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid var(--light-gray);
            border-radius: 4px;
            font-size: 1rem;
        }

        .auth-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            flex-grow: 1;
            transition: background-color 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #45cba8;
        }

        #auth-error {
            color: var(--danger-color);
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* App Container */
        #app-container header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #app-container header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        #user-email {
            font-size: 0.8rem;
            font-weight: 300;
        }

        #logout-btn {
            background: var(--danger-color);
            color: white;
        }

        #logout-btn:hover {
            background: #c0392b;
        }

        #task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #task-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid var(--light-gray);
            border-radius: 4px;
            font-size: 1rem;
        }

        #task-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--light-gray);
            transition: background-color 0.2s ease;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: var(--dark-gray);
        }

        .task-item input[type="checkbox"] {
            margin-right: 15px;
            min-width: 20px;
            height: 20px;
        }

        .task-item span {
            flex-grow: 1;
            cursor: pointer;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .task-item:hover .delete-btn {
            opacity: 1;
        }

        /* Mobile Responsive */
        @media (max-width: 640px) {
            #app {
                margin-top: 0;
                border-radius: 0;
                min-height: 100vh;
            }
            .auth-buttons {
                flex-direction: column;
            }
        }

    </style>
</head>
<body>

    <div id="app">
        <!-- Authentication View -->
        <div id="auth-container" class="container">
            <h2>Welcome to StudyFlow</h2>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="auth-buttons">
                <button id="login-btn" class="btn btn-primary">Login</button>
                <button id="signup-btn" class="btn btn-secondary">Sign Up</button>
            </div>
            <p id="auth-error"></p>
        </div>

        <!-- Main App View -->
        <div id="app-container" style="display: none;">
            <header>
                <div>
                    <h1>StudyFlow</h1>
                    <span id="user-email"></span>
                </div>
                <button id="logout-btn" class="btn">Logout</button>
            </header>
            <main class="container">
                <form id="task-form">
                    <input type="text" id="task-input" placeholder="Add a new task or goal..." required>
                    <button type="submit" class="btn btn-primary">Add</button>
                </form>
                <ul id="task-list">
                    <!-- Tasks will be rendered here -->
                </ul>
            </main>
        </div>
    </div>

    <!-- Firebase v9+ SDK -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        /*
        --- FIREBASE REALTIME DATABASE RULES ---
        This is a critical security step. Copy and paste these rules into your
        Firebase project's Realtime Database > Rules tab. This will ensure that
        users can only read and write their own data.

        {
          "rules": {
            "users": {
              "$uid": {
                ".read": "auth != null && auth.uid == $uid",
                ".write": "auth != null && auth.uid == $uid"
              }
            }
          }
        }
        */

        // --- Firebase v9+ Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyCpBwJQkPywlteA5hvLH43Z2is-WWu-Byo",
            authDomain: "studyflow-8f1c4.firebaseapp.com",
            databaseURL: "https://studyflow-8f1c4-default-rtdb.firebaseio.com",
            projectId: "studyflow-8f1c4",
            storageBucket: "studyflow-8f1c4.firebasestorage.app",
            messagingSenderId: "519193491913",
            appId: "1:519193491913:web:630906098f9b1d8318d018",
            measurementId: "G-GGHHST1EXC"
        };

        // --- Import Firebase v9+ Modules ---
        import { initializeApp } from "firebase/app";
        import {
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut
        } from "firebase/auth";
        import {
            getDatabase,
            ref,
            onValue,
            push,
            remove,
            update,
            serverTimestamp
        } from "firebase/database";

        // --- Initialize Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentUser = null;
        let userTasksRef = null;

        // --- DOM Elements ---
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const authError = document.getElementById('auth-error');
        const userEmailSpan = document.getElementById('user-email');
        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');

        // --- UTILITY FUNCTIONS ---
        function showError(message) {
            authError.textContent = message;
            authError.style.display = 'block';
            setTimeout(() => {
                if (authError.textContent === message) {
                    authError.style.display = 'none';
                }
            }, 3000);
        }

        // --- AUTHENTICATION ---
        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser = user;
                userTasksRef = ref(db, `users/${currentUser.uid}/tasks`);
                showAppView();
                syncOfflineQueue();
                loadTasks();
            } else {
                currentUser = null;
                userTasksRef = null;
                showAuthView();
                clearTasks();
            }
        });

        function showAppView() {
            authContainer.style.display = 'none';
            appContainer.style.display = 'block';
            userEmailSpan.textContent = currentUser.email;
        }

        function showAuthView() {
            authContainer.style.display = 'block';
            appContainer.style.display = 'none';
            authError.style.display = 'none';
            emailInput.value = '';
            passwordInput.value = '';
        }

        loginBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if (!email || !password) return;
            signInWithEmailAndPassword(auth, email, password).catch(err => showError(err.message));
        });

        signupBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if (!email || !password) return;
            createUserWithEmailAndPassword(auth, email, password).catch(err => showError(err.message));
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth).catch(err => showError(err.message));
        });

        // --- TASK MANAGEMENT ---
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const taskText = taskInput.value.trim();
            if (taskText) {
                addTask(taskText);
                taskInput.value = '';
            }
        });

        function addTask(text) {
            const task = {
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };

            if (!navigator.onLine) {
                const offlineQueue = getOfflineQueue();
                const tempId = `offline_${Date.now()}`;
                task.id = tempId;
                offlineQueue.push(task);
                saveOfflineQueue(offlineQueue);
                renderTask(tempId, task);
                console.log("Task saved offline.");
                return;
            }

            if (!userTasksRef) return;
            task.createdAt = serverTimestamp();
            push(userTasksRef, task).catch(err => showError(`Failed to add task: ${err.message}`));
        }

        function deleteTask(taskId) {
            if (taskId.startsWith('offline_')) {
                let queue = getOfflineQueue();
                queue = queue.filter(task => task.id !== taskId);
                saveOfflineQueue(queue);
                document.querySelector(`[data-id="${taskId}"]`).remove();
                return;
            }
            if (!currentUser) return;
            const taskRef = ref(db, `users/${currentUser.uid}/tasks/${taskId}`);
            remove(taskRef).catch(err => showError(`Failed to delete task: ${err.message}`));
        }

        function toggleTaskCompletion(taskId, completed) {
            if (taskId.startsWith('offline_')) {
                showError("Cannot modify offline tasks until synced.");
                const checkbox = document.querySelector(`[data-id="${taskId}"] input[type="checkbox"]`);
                if(checkbox) checkbox.checked = !completed;
                return;
            }
            if (!currentUser) return;
            const taskRef = ref(db, `users/${currentUser.uid}/tasks/${taskId}`);
            update(taskRef, { completed: completed }).catch(err => showError(`Failed to update task: ${err.message}`));
        }

        function clearTasks() {
            taskList.innerHTML = '';
        }

        function renderTask(taskId, task) {
            const taskItem = document.createElement('li');
            taskItem.className = 'task-item';
            taskItem.dataset.id = taskId;
            if (task.completed) taskItem.classList.add('completed');
            if (taskId.startsWith('offline_')) taskItem.style.opacity = '0.6';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed;
            checkbox.addEventListener('change', () => toggleTaskCompletion(taskId, checkbox.checked));

            const span = document.createElement('span');
            span.textContent = task.text;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '&times;';
            deleteBtn.addEventListener('click', () => deleteTask(taskId));

            taskItem.appendChild(checkbox);
            taskItem.appendChild(span);
            taskItem.appendChild(deleteBtn);

            taskList.prepend(taskItem);
        }

        // --- DATA SYNCING & OFFLINE ---
        function getOfflineQueue() {
            if (!currentUser) return [];
            return JSON.parse(localStorage.getItem(`studyflow-offline-queue-${currentUser.uid}`) || '[]');
        }

        function saveOfflineQueue(queue) {
            if (!currentUser) return;
            localStorage.setItem(`studyflow-offline-queue-${currentUser.uid}`, JSON.stringify(queue));
        }

        function syncOfflineQueue() {
            if (!navigator.onLine || !userTasksRef) return;
            const queue = getOfflineQueue();
            if (queue.length === 0) return;

            console.log(`Syncing ${queue.length} offline tasks...`);
            const promises = queue.map(task => {
                const { id, ...taskData } = task;
                taskData.createdAt = serverTimestamp();
                return push(userTasksRef, taskData);
            });

            Promise.all(promises)
                .then(() => {
                    console.log("Offline queue synced successfully.");
                    saveOfflineQueue([]);
                })
                .catch(err => showError(`Failed to sync offline tasks: ${err.message}`));
        }

        function loadTasks() {
            const localTasks = loadTasksFromLocal();
            if (localTasks) {
                clearTasks();
                Object.entries(localTasks).forEach(([id, task]) => renderTask(id, task));
            }

            if (userTasksRef) {
                onValue(userTasksRef, snapshot => {
                    if (!navigator.onLine) return;
                    clearTasks();
                    const tasks = snapshot.val();
                    if (tasks) {
                        Object.entries(tasks).forEach(([id, task]) => renderTask(id, task));
                        saveTasksToLocal(tasks);
                    } else {
                        localStorage.removeItem(`studyflow-tasks-${currentUser.uid}`);
                    }
                    getOfflineQueue().forEach(task => renderTask(task.id, task));
                }, error => {
                    showError(error.message);
                    console.error(error);
                });
            }
        }

        function saveTasksToLocal(tasks) {
            if (!currentUser) return;
            try {
                localStorage.setItem(`studyflow-tasks-${currentUser.uid}`, JSON.stringify(tasks));
            } catch (e) {
                showError("Could not save tasks locally.");
                console.error(e);
            }
        }

        function loadTasksFromLocal() {
            if (!currentUser) return null;
            try {
                const tasks = localStorage.getItem(`studyflow-tasks-${currentUser.uid}`);
                return tasks ? JSON.parse(tasks) : null;
            } catch (e) {
                showError("Could not load local tasks.");
                console.error(e);
                return null;
            }
        }

        window.addEventListener('online', () => {
            console.log("Back online. Syncing data...");
            syncOfflineQueue();
            if(userTasksRef) {
                loadTasks();
            }
        });

        window.addEventListener('offline', () => {
            console.log("App is offline. Using local data.");
        });
    </script>
</body>
</html>
