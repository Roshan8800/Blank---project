<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studyflow - Tasks</title>
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        body { min-height: max(884px, 100dvh); }
        .view { display: none; }
        .view.active { display: block; }
        :root {
            --checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(255,255,255)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');
        }
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
</head>
<body class="bg-gray-950">
    <div class="relative flex h-auto min-h-screen w-full flex-col bg-[#120B1A] dark justify-between group/design-root overflow-x-hidden" style='font-family: Inter, "Noto Sans", sans-serif;'>
        <div class="flex-grow">
            <!-- Tasks View -->
            <div id="tasks-view" class="view active">
                <header class="flex items-center p-4 justify-between sticky top-0 bg-[#120B1A]/80 backdrop-blur-sm z-10">
                    <button class="text-white flex size-10 shrink-0 items-center justify-center rounded-full">
                        <span class="material-symbols-outlined text-2xl">menu</span>
                    </button>
                    <h1 class="text-white text-xl font-bold leading-tight tracking-tight">Tasks</h1>
                    <button class="text-white flex size-10 shrink-0 items-center justify-center rounded-full bg-[#9643ea]">
                        <span class="material-symbols-outlined text-2xl">add</span>
                    </button>
                </header>
                <main class="flex-grow px-4 pb-4 space-y-3">
                    <!-- Tasks will be rendered here by script.js -->
                </main>
            </div>
        </div>

        <nav class="sticky bottom-0 bg-[#1C1326]/80 backdrop-blur-sm">
            <div class="flex justify-around border-t border-[#362447] px-2 py-2">
                <a class="flex flex-1 flex-col items-center justify-end gap-1.5 p-2 text-[#ad93c8]" href="goals.html">
                    <span class="material-symbols-outlined !text-2xl">emoji_events</span>
                    <p class="text-xs font-medium leading-tight">Goals</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1.5 rounded-full bg-[#9643ea]/20 p-2 text-white" href="tasks.html">
                    <span class="material-symbols-outlined !text-2xl">task_alt</span>
                    <p class="text-xs font-bold leading-tight">Tasks</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1.5 p-2 text-[#ad93c8]" href="planner.html">
                    <span class="material-symbols-outlined !text-2xl">calendar_month</span>
                    <p class="text-xs font-medium leading-tight">Planner</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1.5 p-2 text-[#ad93c8]" href="progress.html">
                    <span class="material-symbols-outlined !text-2xl">monitoring</span>
                    <p class="text-xs font-medium leading-tight">Progress</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1.5 p-2 text-[#ad93c8]" href="focus.html">
                    <span class="material-symbols-outlined !text-2xl">hourglass_top</span>
                    <p class="text-xs font-medium leading-tight">Focus</p>
                </a>
            </div>
            <div class="h-3 bg-transparent"></div>
        </nav>
    </div>
    <script src="script.js"></script>

    <!-- Add Task Modal -->
    <div id="add-task-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20">
        <div id="new-task-form" class="bg-[#1E1926] p-6 rounded-lg w-full max-w-md m-4">
            <h2 class="text-white text-2xl font-bold mb-4">Add New Task</h2>
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Task title" required class="w-full bg-[#2a2135] border-none rounded-md mb-3 text-white placeholder-gray-400">
                <textarea id="task-content" placeholder="Task details" class="w-full bg-[#2a2135] border-none rounded-md mb-3 text-white placeholder-gray-400"></textarea>
                <input type="date" id="task-due-date" class="w-full bg-[#2a2135] border-none rounded-md mb-4 text-gray-400">
                <div class="flex gap-4">
                    <button type="button" id="cancel-task-button" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md">Cancel</button>
                    <button type="submit" class="flex-1 bg-[#9643ea] hover:bg-[#8038c5] text-white font-bold py-2 px-4 rounded-md">Add Task</button>
                </div>
            </form>
        </div>
    </div>
    <div id="toast-container" class="fixed bottom-24 right-4 space-y-2 z-50"></div>
</body>
</html>
